# Local LiveKit stack for the EME-014/015 spikes. Host networking so ICE uses 127.0.0.1 directly.
# Start with ./up.sh (generates credentials into .run/, never committed).
services:
  redis:
    image: redis:7.4-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--save", "", "--appendonly", "no"]
  livekit:
    image: livekit/livekit-server:v1.13.11
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./.run/livekit.yaml:/etc/livekit.yaml:ro"]
    depends_on: [redis]
  ingress:
    image: livekit/ingress:v1.6.0
    network_mode: host
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yaml
    volumes: ["./.run/ingress.yaml:/etc/ingress.yaml:ro"]
    depends_on: [redis, livekit]
